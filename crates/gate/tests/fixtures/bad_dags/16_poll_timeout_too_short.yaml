# expect: poll.timeout_too_short
# The first wait already exceeds the timeout, so the condition is never re-checked.
id: bad-16
nodes:
  - { id: create, type: http, method: POST, path: /jobs }
  - id: wait
    type: poll
    request: { method: GET, path: /jobs/1 }
    condition: { path: $.body.state, op: eq, expected: done }
    backoff_ms: [5000]
    timeout_ms: 1000
edges:
  - { from: create, to: wait }
