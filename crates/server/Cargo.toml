[package]
name = "server"
description = "Local HTTP API for the Web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aitest-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
async-stream = "0.3"
common = { workspace = true }
engine = { workspace = true }
gate = { workspace = true }
importer = { path = "../importer", default-features = false }
generator = { path = "../generator" }
llm-gateway = { workspace = true }
futures-util = "0.3"
model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
common = { workspace = true }
mock-sut = { path = "../mock-sut" }
rustls = { workspace = true }
http-body-util = "0.1"
serde_json = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
