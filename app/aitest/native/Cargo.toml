[workspace]

[package]
name = "aitest-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
nsh = ["dep:nsh-core", "dep:nsh-macros"]

[dependencies]
nsh-bridge = { path = "../../../crates/nsh-bridge" }
serde_json = "1"

[dependencies.nsh-core]
version = "0.4"
optional = true

[dependencies.nsh-macros]
version = "0.4"
optional = true
